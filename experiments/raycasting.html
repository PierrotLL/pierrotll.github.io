<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<style>
	body { margin: 0; width: 100%; height: 100svh; contain: strict; }
</style>
<canvas id="display"></canvas>
<script>
const CIRCLE = Math.PI*2;

function rotateVector(x, y, angle) {
	let cos = Math.cos(angle), sin = Math.sin(angle);
	return [x * cos - y * sin, x * sin + y * cos];
}

class Bitmap {
	constructor(url) {
		this.img = new Image;
		this.img.onload = _=> { this.width = this.img.width; this.height = this.img.height; }
		this.img.src = url;
	}
}

class Controls {
	constructor() {
		this.state = {};
		this.keys = {"ArrowLeft":"left", "ArrowRight":"right", "ArrowUp":"forward", "ArrowDown":"backward"};
		addEventListener("keydown", e => this.state[this.keys[e.key]] = true);
		addEventListener("keyup", e => this.state[this.keys[e.key]] = false);
		addEventListener("touchstart", e => { this.startX = e.touches[0].clientX; this.startY = e.touches[0].clientY });
		addEventListener("touchmove", e => {
			e.preventDefault();
			this.state = {};
			let dx = e.touches[0].clientX - this.startX, dy = e.touches[0].clientY - this.startY;
			if (Math.abs(dx) > 50) this.state[dx<0 ? "left" : "right"] = true;
			if (Math.abs(dy) > 50) this.state[dy<0 ? "forward" : "backward"] = true;
		}, {passive: false})
		addEventListener("touchend", _=> this.state = {});
	}
}

class Map {
	constructor(dimention) {
		this.width = dimention;
		this.height = dimention;
		this.data = [];
	}
	randomize(wallFrequency) {
		for (let i=0 ; i<this.width*this.height ; i++) this.data[i] = Math.random() < wallFrequency ? 2 : 0;
	}
	inBounds(x, y) {
		return x>=0 && x<this.width && y>=0 && y<this.height;
	}
	get(x, y) {
		return this.inBounds(x, y) ? this.data[Math.floor(y) * this.width + Math.floor(x)] : 1;
	}
}

class Camera {
	constructor(x, y, angle) {
		this.x = x;
		this.y = y;
		this.dirX = Math.cos(angle);
		this.dirY = Math.sin(angle);
		this.moveSpeed = 2; // cells per sec
		this.turnSpeed = 3; // rad per sec
		this.radius = .2; // minimum distance to walls
		this.fov = Math.PI/2;
	}
	resize(width, height) {
		[this.planeX, this.planeY] = rotateVector(this.dirX, this.dirY, -Math.PI/2);
		this.planeX *= width/height*.5;
		this.planeY *= width/height*.5;
	}
	rotate(angle) {
		[this.dirX, this.dirY] = rotateVector(this.dirX, this.dirY, angle);
		[this.planeX, this.planeY] = rotateVector(this.planeX, this.planeY, angle);
	}
	move(controls, map, seconds) {
		if (controls.state.left ^ controls.state.right) {
			let dir = controls.state.left ? 1 : -1;
			if (controls.state.forward) dir *= .7;
			this.rotate(this.turnSpeed * dir * seconds);
		}
		if (controls.state.forward ^ controls.state.backward) {
			let dir = controls.state.forward ? 1 : -1;
			let dx = this.dirX * dir * this.moveSpeed * seconds;
			let dy = this.dirY * dir * this.moveSpeed * seconds;
			if (map.get(this.x+dx+this.radius*(dx<0?-1:1), this.y)) this.x = dx<0 ? Math.floor(this.x)+this.radius : Math.ceil(this.x)-this.radius;
			else this.x += dx;
			if (map.get(this.x, this.y+dy+this.radius*(dy<0?-1:1))) this.y = dy<0 ? Math.floor(this.y)+this.radius : Math.ceil(this.y)-this.radius;
			else this.y += dy;
		}
	}
}

class Renderer {
	constructor() {
		this.ctx = display.getContext("2d");
		this.assets = {
			wall: new Bitmap("wall.jpg"),
			sky: new Bitmap("sky.avif")}
	}
	drawSky(camera) {
		let sky = this.assets.sky,
			width = display.height * sky.width / sky.height * 6,
			left = (Math.atan2(camera.dirY, camera.dirX) - Math.PI) / CIRCLE * width;
		this.ctx.drawImage(sky.img, left, 0, width, display.height);
		if (left < width - display.width) this.ctx.drawImage(sky.img, left+width-1, 0, width, display.height);
	}
	drawWalls(camera, map) {
		let width = display.width, height = display.height;
		for (let i=0 ; i<width ; i++) {
			let ray = castRay(map, camera, i);
			this.drawColumn(i, 1, height/ray.dist, ray.face, ray.wallX);
		}
	}
	drawColumn(x, width, height, face, textureX) {
		let wall = this.assets.wall;
		let top = (display.height-height)*.5;
		this.ctx.drawImage(wall.img, (wall.width-1)*textureX, 0, 1, wall.height, x, top, width, height);
		this.ctx.fillStyle = ["#83511055", "#d9861a55", "#ad6b1555", "#ad6b1555"][face];
		this.ctx.fillRect(x, top, width, height);
		this.ctx.fillStyle = "rgba(0,0,0,"+Math.min(Math.max(1-height/display.height*5, 0), .8).toFixed(3)+")";
		this.ctx.fillRect(x, top, width, height);
	}
	render(camera, map) {
		this.drawSky(camera);
		this.drawWalls(camera, map);
	}
}

function castRay(map, camera, column) {
	let mapX = camera.x|0, mapY = camera.y|0;
	let cameraX = 2 * column/display.width - 1;
	let rayX = camera.dirX + camera.planeX * cameraX;
	let rayY = camera.dirY + camera.planeY * cameraX;
	let deltaX = 1 / Math.abs(rayX), deltaY = 1 / Math.abs(rayY);
	let sideX = (rayX<0 ? camera.x - mapX : mapX + 1 - camera.x) * deltaX, sideY = (rayY<0 ? camera.y - mapY : mapY + 1 - camera.y) * deltaY;
	let stepX = rayX<0 ? -1 : 1, stepY = rayY<0 ? -1 : 1;
	let hit = 0, side;
	while (!hit) {
		if (sideX < sideY) {
			sideX += deltaX;
			mapX += stepX;
			side = 0;
		} else {
			sideY += deltaY;
			mapY += stepY;
			side = 1;
		}
		hit = map.get(mapX, mapY);
	}
	let dist = side ? sideY - deltaY : sideX - deltaX;
	let face = (1-side) * 2 + ((side ? stepY : stepX) > 0); //0=North, 1=South, 2=Est, 3=West
	let wallX = (side ? camera.x + dist * rayX : camera.y + dist * rayY) % 1;
	return { column:column, x:mapX, y:mapY, dist:dist, type:hit, face:face, wallX:wallX };
}


class Game {
	constructor() {
		this.map = new Map(50);
		this.map.randomize(.35);
		this.controls = new Controls();
		this.camera = new Camera(Math.floor(this.map.width/2)+.5, Math.floor(this.map.height/2)+.5, 0);
		this.renderer = new Renderer();
		this.frame = this.frame.bind(this);
	}
	start() {
		requestAnimationFrame(this.frame);
	}
	frame(now) {
		let seconds = (now - this.lastFrame) * .001;
		this.lastFrame = now;
		if (seconds < .5) this.camera.move(this.controls, this.map, seconds);
		this.renderer.render(this.camera, this.map);
		requestAnimationFrame(this.frame);
	}
}

let game = new Game();
function resize() {
	let w = innerWidth, h = innerHeight, r = w/h;
	//display.width = Math.min(w, 500);
	display.width = w;
	display.height = display.width/r;
	display.style.width = w+"px";
	game.camera.resize(w, h);
}
addEventListener("resize", resize);
resize();
game.start();
</script>
