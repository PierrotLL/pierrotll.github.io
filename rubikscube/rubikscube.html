<!DOCTYPE html>
<title>Rubik's Cube</title>
<link rel="icon" type="image/png" href="icon-64.webp" />
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="description" content="Play Rubik's Cube in your browser" />
<meta name="viewport" content="width=device-width,user-scalable=no,interactive-widget=resizes-content" />

<link rel="manifest" href="rubikscube.webmanifest" />
<script>if (navigator.serviceWorker) navigator.serviceWorker.register("rubikscube-sw.js");</script>
<script src="../pwaInstallButton.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@easy-pwa/beforeinstallprompt-polyfill@1.0.0-BETA1/dist/beforeinstallprompt-polyfill.min.js"></script>

<style>
html { height: 100% }
body {
	margin: 0;
	min-height: 100%;
	position: relative; /* helpButton position */
	background: #000;
	font: 16px sans-serif;
	color: #000;
}
.grabbing * {
	cursor: grabbing !important;
}

#scene {
	position: fixed;
	z-index: 0;
	width: 100vw;
	height: 100svh;
	contain: strict;
	user-select: none;
	font-size: min(60vmin, max(40vmin, 25svh)); /* cube size */
	perspective: 4em;
	background: radial-gradient(circle at 50% calc(50% + 15vmin), #999, #000);
	cursor: move;
}
#scene * { transform-style: preserve-3d }
#scene > * { will-change: transform }

#cube {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: rotateX(var(--rx)) rotateY(var(--ry)) scale3d(var(--sc),var(--sc),var(--sc));
	cursor: grab;
}

.piece {
	--rx: 0; --ry: 0; --rz: 0;
	transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) translate3d(var(--x),var(--y),var(--z));
}

.face {
	width: 1em;
	height: 1em;
	position: absolute;
	background: #000;
	border-radius: 15%;
	translate: -50% -50%;
    outline: 1px solid transparent; /* webkit aliasing */
}
.up { transform: rotateX(90deg) translateZ(.5em) }
.down { transform: rotateX(-90deg) translateZ(.5em) }
.back { transform: rotateY(180deg) translateZ(.5em) }
.front { transform: translateZ(.5em) }
.left { transform: rotateY(-90deg) translateZ(.5em) }
.right { transform: rotateY(90deg) translateZ(.5em) }
.up:before, .back:before, .left:before { /* prevent seeing through border-radius */
	content: "";
	position: absolute;
	width: 100%;
	height: 100%;
	background: inherit;
	transform: translateZ(-.5em);
}

.sticker {
	margin: .05em;
	aspect-ratio: 1;
	border-radius: 15%;
	backface-visibility: hidden;
	transform: translateZ(1px);
	box-shadow: inset .02em .02em .05em #FFFFFF80, inset -.02em -.02em .05em #00000080;
    outline: inherit;
}
.red { background: red }
.orange { background: orange }
.yellow { background: yellow }
.white { background: white }
.blue { background: blue }
.green { background: green }

.flat .face { border-radius: 0; backface-visibility: hidden; outline: unset; }
.flat :before { display: none; }
.flat .sticker { box-shadow: unset; }
.flat + #compass { outline: unset; }

#compass {
	pointer-events: none;
	position: absolute;
	bottom: 1rem;
	left: 50%;
	translate: -50%;
	width: 2rem;
	aspect-ratio: 1;
	z-index: -1;
	background: linear-gradient(45deg, #55f, #009 50%, #600 50%, #e00);
    outline: 1px solid transparent;
	transform: rotateX(var(--rx)) rotateY(var(--ry)) scale3d(.15,.15,sin(45deg)) rotate3d(-1,-1,0,-90deg);
}
#compass:before, #compass:after, #compass *, #compass *:after {
	content: "";
	position: absolute;
	width: 100%;
	height: 100%;
	background: inherit;
    outline: inherit;
}
#compass:before { transform: rotate3d(-1,1,0,60deg) }
#compass:after { transform: rotate3d(-1,1,0,120deg) }
#compass *, #compass *:after {
	border-radius: 50%;
	backface-visibility: hidden;
}
#compass * {
	background: #009;
	transform: rotate3d(1,1,0,-90deg) scale(calc(1/sin(45deg)));
}
#compass *:after {
	background: #600;
	transform: rotateX(180deg);
}


#menu {
	display: inline-block;
	padding: 1em;
	margin-bottom: 3em;
	max-height: 2em;
	contain: paint;
}
#menu, #openMenu * { transition: .4s }
#menu > * { display: flex; gap: .3em }
select, input[type="text"] { width: 9em }
#menu * button { flex-grow: 1 }
label {
	display: block;
	margin-top: .5em;
	color: #fff;
}
input, select, button {
	box-sizing: border-box;
	padding: .5em 1em;
	font-size: inherit;
	text-align: center;
	color: #000;
}
option:checked { font-weight: bold }


#helpButton {
	position: absolute;
	bottom: 0;
	margin: 1em;
	padding: 0 !important;
	contain: content;
	min-width: 2em;
	min-height: 2em;
	--max-width: min(calc(100vw - 2em), 500px);
	border-radius: 1em;
	border: solid 1px #fff;
	background: linear-gradient(aqua, navy);
	color: #fff;
	display: flex;
	align-items: center;
}
#helpButton:active { background: navy }
#helpButton:before {
	content: "?";
	font-size: 1.5em;
	font-weight: bold;
	width: calc(2rem - 2px);
}
#helpButton .wrapper {
	max-width: calc(var(--max-width) - 2em);
	max-height: 10em;
	transition: max-width .5s, max-height .5s .3s;
}
#helpButton .wrapper:has(#help:empty) {
	max-width: 0;
	max-height: calc(2em - 2px);
}
#help {
	box-sizing: border-box;
	width: max-content;
	height: max-content;
	max-width: calc(var(--max-width) - 2em);
	padding: .25em;
	text-align: left;
}
#help:empty { padding: 0 }


#fps {
	pointer-events: none;
	position: fixed;
	top: 0;
	right: 0;
	color: #888;
	font: .7em monospace;
}
#fps:before { content: "FPS:" }


#saveIcon {
	pointer-events: none;
	position: fixed;
	bottom: 0;
	right: 0;
	margin: 1em;
	opacity: 0;
}
#saveIcon:before { content: "\1F4BE" }
.saved { animation: 1s linear saved }
@keyframes saved {
	20%, 80% { opacity: 1 }
	100% { opacity: 0 }
}
</style>

<body>
	<div id=scene>
		<div id=cube></div>
		<div id=compass><div></div></div>
	</div>
	
	<div id=fps></div>
	<div id=saveIcon></div>
	<button id=helpButton><div class=wrapper><div id=help></div></div></button>
	<div id=menu>
		<button id=openMenu><div>+</div></button>
		<label for=cubeSize>Cube size</label>
		<div>
			<select id=cubeSize>
				<option value=2>2x2x2</option>
				<option value=3>3x3x3</option>
				<option value=4>4x4x4</option>
				<option value=5>5x5x5</option>
			</select>
			<button id=scrambleButton>Scramble</button>
		</div>
		<label for=move>Movements input</label>
		<form>
			<input type=text id=move placeholder="L R' U2 d Fw x" autocomplete="off" />
			<button type=submit>Apply</button>
		</form>
		<label for=history>History</label>
		<div>
			<input type=text id=history autocomplete="off" disabled />
			<button id=backward disabled>&lt;</button>
			<button id=forward disabled>&gt;</button>
		</div>
	</div>
</body>

<script>
(_=>{
openMenu.onclick = _=> [menu.style.maxHeight, openMenu.firstElementChild.style.rotate] = menu.style.maxHeight ? ['', ''] : ['16em', '45deg'];

const FACES = [
	{name:"up", x:0, y:-1, z:0, color:"red"},
	{name:"down", x:0, y:1, z:0, color:"orange"},
	{name:"back", x:0, y:0, z:-1, color:"white"},
	{name:"front", x:0, y:0, z:1, color:"yellow"},
	{name:"left", x:-1, y:0, z:0, color:"green"},
	{name:"right", x:1, y:0, z:0, color:"blue"}];

const pieces = [];
function buildCube(size) {
	cube.innerHTML = "";
	cube.style.fontSize = 1/size+"em";
	cube.classList.remove("flat");
	pieces.length = 0;
	let max = Math.floor(size-1)/2;
	for (let x=-max, y=-max, z=-max ; z<=max ; ++x>max ? ++y>max ? (++z, x=y=-max) : x=-max : 0) {
		if (Math.abs(x)==max || Math.abs(y)==max || Math.abs(z)==max) {
			let piece = cube.appendChild(document.createElement("div")), stickers = {};
			piece.className = "piece";
			piece.style = "--x:"+x+"em;--y:"+y+"em;--z:"+z+"em";
			FACES.forEach(f => {
				let face = piece.appendChild(document.createElement("div"));
				face.className = "face "+f.name;
				if ((x && x == f.x*max) || (y && y == f.y*max) || (z && z == f.z*max)) {
					(stickers[f.name] = face.appendChild(document.createElement("div"))).className = "sticker "+f.color;
				}
			});
			pieces.push({e:piece, x:x, y:y, z:z, s:stickers});
		}
	}
}
buildCube(cubeSize.value = 3);
cubeSize.onchange = _=> {
	buildCube(cubeSize.value);
	history.clear();
	save.erase();
	helper.hide();
	timer.clear();
}
function getMaxCoord() {
	return Math.abs(pieces[0].x);
}
function getCubeSize() {
	return getMaxCoord()*2+1;
}
function getPieces(selector) {
	if (!selector) return pieces;
	if (selector[0] instanceof Array) return selector.map(getPieces).flat();
	return pieces.filter(o=>o[selector[0]]==selector[1]);
}


["mousedown", "touchstart"].forEach(type => scene.addEventListener(type, touchstart));
["mousemove", "touchmove"].forEach(type => addEventListener(type, touchmove, {passive: false}));
["mouseup", "click", "touchend", "touchcancel"].forEach(type => addEventListener(type, touchend));
scene.addEventListener("wheel", e => rotateCube(rotation, tilt, scale - e.deltaY * .001));

const touch = {};
function touchstart(e) {
	if (touch.down) touchend();
	if (e.touches && e.touches.length > 1) {
		touch.startX = touch.lastX = [e.touches[0].clientX, e.touches[1].clientX];
		touch.startY = touch.lastY = [e.touches[0].clientY, e.touches[1].clientY];
	} else if (e.touches || e.buttons == 1) {
		touch.startX = touch.lastX = e.x || e.touches[0].clientX;
		touch.startY = touch.lastY = e.y || e.touches[0].clientY;
		touch.face = e.target.closest(".face");
		touch.down = e.target == scene || touch.face != null;
		if (touch.face) document.body.classList.add("grabbing");
	}
}
function touchmove(e) {
	if (e.touches && e.touches.length > 1) {
		let distance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
		let previous = Math.hypot(touch.lastX[0] - touch.lastX[1], touch.lastY[0] - touch.lastY[1]);
		rotateCube(rotation, tilt, scale * ((distance / previous - 1) * .5 + 1));
		touch.lastX = [e.touches[0].clientX, e.touches[1].clientX];
		touch.lastY = [e.touches[0].clientY, e.touches[1].clientY];
	} else if (touch.down) {
		if (e.touches) e.preventDefault(); // prevent refresh on mobile
		e.x ||= e.touches ? e.touches[0].clientX : 0;
		e.y ||= e.touches ? e.touches[0].clientY : 0;
		let pxToAngle = 360 / Math.min(innerWidth, innerHeight);
		if (touch.face && !touch.piecesRotationDisabled) {
			let vector = screenToSceneVector(e.x - touch.startX, e.y - touch.startY);
			touch.axis ||= Math.hypot.apply(null, vector)*pxToAngle > 5 ? getMoveAxis(touch.face.classList[1], vector) : null;
			if (touch.axis) {
				finishAnimation();
				touch.selector ||= [ touch.axis[0], getPieces(["e",touch.face.parentElement])[0][touch.axis[0]] ];
				touch.pieces ||= getPieces(touch.selector);
				touch.piecesRotation = vector[touch.axis[1]] * touch.axis[2] * pxToAngle;
				cancelAnimationFrame(touch.animation);
				touch.animation = requestAnimationFrame(_=> rotatePiecesTemporarily(touch.pieces, touch.axis[0], touch.piecesRotation));
			}
		} else {
			rotateCube(rotation + (e.x - touch.lastX) * pxToAngle, tilt - (e.y - touch.lastY) * pxToAngle, scale);
		}
		touch.lastX = e.x;
		touch.lastY = e.y;
	}
}
function touchend(e) {
	if (touch.axis) {
		let toAngle = Math.round(touch.piecesRotation / 90)*90;
		cancelAnimationFrame(touch.animation);
		rotatePiecesAnimated(touch.pieces, touch.axis[0], touch.piecesRotation, toAngle, .1, Ease.easeInCubic);
		if (toAngle % 360) history.add(getMoveName(touch.selector, normalizeAngle(toAngle)));
	}
	touch.down = touch.face = touch.axis = touch.selector = touch.pieces = null;
	document.body.classList.remove("grabbing");
}
onkeydown = e => {
	if (e.target != document.body || e.ctrlKey || e.metaKey) return;
	switch (e.key) {
		case "ArrowUp": rotateCube(rotation, e.shiftKey ? 22.5 : tilt+5, scale); break;
		case "ArrowDown": rotateCube(rotation, e.shiftKey ? -22.5 : tilt-5, scale); break;
		case "ArrowLeft": rotateCube(e.shiftKey ? Math.round((rotation-67.5)/45)*45+22.5 : rotation-5, tilt, scale); break;
		case "ArrowRight": rotateCube(e.shiftKey ? Math.round((rotation+67.5)/45)*45-22.5 : rotation+5, tilt, scale); break;
		case "+": rotateCube(rotation, tilt, Math.round((scale+.25)*4)/4); break;
		case "-": rotateCube(rotation, tilt, Math.round((scale-.25)*4)/4); break;
		case "<": history.back(); break;
		case ">": history.forward(); break;
		default: if ("XYZLRUDBFMES".includes(e.key.toUpperCase())) e.preventDefault() || parseInput((e.altKey ? e.key.toLowerCase() : e.key.toUpperCase()) + (e.shiftKey ? "'":""));
	}
}


const DEG_TO_RAD = Math.PI/180;
function normalizeAngle(a) {
	return (a%360-540)%360+180;
}

function screenToSceneVector(dx, dy) {
	return Vector.rotateY(Vector.rotateX([dx, dy, 0], -tilt*DEG_TO_RAD), -rotation*DEG_TO_RAD);
}

const AXIS = ["x", "y", "z"];
const FACES_AXIS = { up:[0,2],down:[2,0], front:[0,1],back:[1,0], left:[2,1],right:[1,2] };
function getMoveAxis(face, vector) { // return [ axis name (x|y|z), scene vector component to use for rotation angle (0|1|2), vector component factor (-1|1) ]
	let axis = FACES_AXIS[face];
	return Math.abs(vector[axis[0]]) > Math.abs(vector[axis[1]]) ? [AXIS[axis[1]], axis[0], 1] : [AXIS[axis[0]], axis[1], -1];
}

const SWAP = {x:{"-90":{},90:{},180:{}},y:{"-90":{},90:{},180:{}},z:{"-90":{},90:{},180:{}}};
requestAnimationFrame(_=>{
	let face2vector = Object.fromEntries(FACES.map(f => [ f.name, [f.x,f.y,f.z] ]));
	let vector2face = Object.fromEntries(FACES.map(f => [ [f.x,f.y,f.z], f.name ]));
	for (let axis in SWAP) {
		for (let angle in SWAP[axis]) {
			for (let face in face2vector) {
				let vector = Vector["rotate"+axis.toUpperCase()](face2vector[face], -angle*DEG_TO_RAD).map(Math.round);
				SWAP[axis][angle][vector2face[vector.join()]] = face;
			}
		}
	}
});


let rotation=0, tilt=0, scale=1;
function rotateCube(x, y, s) {
	rotation = normalizeAngle(x);
	tilt = Math.min(Math.max(y, -90), 90);
	scale = Math.min(Math.max(s, .5), 1.5);
	cancelAnimationFrame(touch.animation);
	touch.animation = requestAnimationFrame(_=> updatePiecesVisibility(), scene.style = "--rx:"+tilt+"deg;--ry:"+rotation+"deg;--sc:"+scale);
}
rotateCube(-22.5, -22.5, 1);

function rotatePiecesTemporarily(pieces, axis, angle) {
	let property = "--r"+axis, value = angle ? normalizeAngle(angle)+"deg" : null;
	pieces.forEach(p=>p.e.style.setProperty(property, value));
	updatePiecesVisibility(true);
}

function rotatePiecesPermanently(pieces, axis, angle) {
	if (angle % 360 == 0) return rotatePiecesTemporarily(pieces, axis, 0);
	let swap = SWAP[axis][normalizeAngle(angle)];
	pieces.forEach(p => {
		let vector = Vector["rotate"+axis.toUpperCase()]([p.x,p.y,p.z], angle*DEG_TO_RAD);
		vector.forEach((v, i) => p[AXIS[i]] = Math.round(v*2)*.5);
		p.e.style = "--x:"+p.x+"em;--y:"+p.y+"em;--z:"+p.z+"em";
		let name, stickers = {};
		for (name in p.s) stickers[swap[name]] = p.s[name];
		p.s = stickers;
		p.e.childNodes.forEach(face => (name=face.classList[1]) && p.s[name] && face.append(p.s[name]));
	});
	updatePiecesVisibility(true);
	timer.move();
}

let animation;
function rotatePiecesAnimated(pieces, axis, fromAngle, toAngle, duration, ease) {
	if (!duration) return rotatePiecesPermanently(pieces, axis, toAngle);
	animation = { id:requestAnimationFrame(animationFrame), pieces:pieces, axis:axis, to:toAngle, delta:toAngle-fromAngle, duration:duration*1e3, end:performance.now()+duration*1e3, ease:ease };
}
function animationFrame(now) {
	if (now >= animation.end) return finishAnimation();
	let progress = 1 - (animation.end - now) / animation.duration;
	rotatePiecesTemporarily(animation.pieces, animation.axis, animation.to - animation.delta * (1-animation.ease(progress)));
	animation.id = requestAnimationFrame(animationFrame);
}
function finishAnimation() {
	if (animation) {
		cancelAnimationFrame(animation.id);
		rotatePiecesPermanently(animation.pieces, animation.axis, animation.to);
		animation = null;
	}
}

let piecesVisibilityFlags;
function updatePiecesVisibility(allVisible) { // set hidden=true on non-visible pieces to speed up rendering
	let max = getMaxCoord(), flags = allVisible ? 0 : 1 | (rotation>0)<<1 | (tilt<0)<<2 | (Math.abs(rotation)>90)<<3;
	if (flags != piecesVisibilityFlags) pieces.forEach(p=>p.e.hidden = flags&1 && p.x!=(flags&2?-max:max) && p.y!=(flags&4?-max:max) && p.z!=(flags&8?-max:max));
	piecesVisibilityFlags = flags;
}


function getMoveName(selector, angle) {
	let max = getMaxCoord(), [axis, coord] = selector;
	let [name, dir] = {
		x: [ ["L",-1],["M",-1],["R",1] ],
		y: [ ["U",-1],["E",1],["D",1] ],
		z: [ ["B",-1],["S",1],["F",1] ]
	} [axis][coord/Math.abs(coord||1)+1];
	if (coord && Math.abs(coord) < max) name = name.toLowerCase();
	if (angle == 180) name += 2;
	else if (angle * dir < 0) name += "'";
	return name;
}

function reverseMove(move) {
	let [match, name, modifier] = move.match(/(\d*[xLlMmRryUuEeDdzBbSsFf]w?)('|2)?/);
	return modifier==2 ? match : modifier=="'" ? name : name+"'";
}

function parseInput(str) {
	let cubeSize = getCubeSize();
	if (cubeSize == 2) str = str.replaceAll(/[MESw]/gi, "").replaceAll(/[lrudbf]/g, l=>l.toUpperCase()); // no inner slice nor wide move
	else if (cubeSize == 3) str = str.replaceAll(/([LRUDBF])w/gi, (_,l)=>l.toLowerCase()); // for 3x3x3 r means Rw
	else str = str.replace(/([lrudbf])w/g, (_,l)=>l.toUpperCase()+"w"); // rw is equivalent to Rw
	str = str.replaceAll(/[XYZ]/g, l=>l.toLowerCase()); // xyz always in lower case
	str = str.replaceAll(/\d*[xLlMmRryUuEeDdzBbSsFf]w?['2]?/g, m=>m+" "); // add space between moves to avoid confusing pre/post numbers (slice number/turn quarters)
	str = str.replaceAll(/\d*([xyzMES])w?/gi, (_,l)=>l); // remove useless slice number and wide flag
	str = str.replaceAll(/(\d+)([LRUDBF])/gi, (_,n,l)=>n==2 ? l.toLowerCase() : (n>2?n:"")+l.toUpperCase()); // 1r or 1R => R, 2R => r, 3r => 3R
	while (str.match(/\([^\(\)]+\)['\d]/)) { // nested groups
		str = str.replaceAll(/\(([^\(\)]+)\)('|\d+)/g, (_,s,n)=>n=="'" ? s.replaceAll(" ", "' ") : s.repeat(n));
	}
	applyMoves(str);
}
move.form.onsubmit = _=> { parseInput(move.value); move.value=move.placeholder=""; return false; }

function applyMoves(str, duration=.4) {
	let match = str && str.match(/(\d*)([xLlMmRryUuEeDdzBbSsFf])(w)?('|2)?/);
	if (match) {
		let [move, depth, letter, wide, modifier] = match;
		let isLowerCase = letter == letter.toLowerCase();
		let max = getMaxCoord();
		let [axis, coord, angle] = {
			x: ["x", 0, 90],
			l: ["x", -1, -90],
			m: ["x", 0, -90],
			r: ["x", 1, 90],
			y: ["y", 0, -90],
			u: ["y", -1, -90],
			e: ["y", 0, 90],
			d: ["y", 1, 90],
			z: ["z", 0, 90],
			b: ["z", -1, -90],
			s: ["z", 0, 90],
			f: ["z", 1, 90],
		}[letter.toLowerCase()];
		if (max == 1 && isLowerCase) wide = true;
		depth ||= wide || isLowerCase ? 2 : 1;
		
		let selector;
		if ("xyz".includes(letter));
		else if ("mes".includes(letter)) selector = Array.from({length:max*2},(_,i)=> [ axis, i-max + (i<max ? 0:1) ]);
		else if (wide) selector = Array.from({length:depth}, (_,i)=> [ axis, (max-i)*coord ]);
		else selector = [axis, coord*(max-depth+1)];
		if (modifier) angle *= modifier==2 ? 2 : -1;
		
		finishAnimation();
		rotatePiecesAnimated(getPieces(selector), axis, 0, angle, duration, Ease.easeInOutCubic);
		history.add(move);
		
		str = str.substring(str.indexOf(move)+move.length);
		if (str.length) {
			touch.piecesRotationDisabled = true;
			if (duration) setTimeout(applyMoves, duration*1e3, str, duration);
			else applyMoves(str, 0);
		} else delete touch.piecesRotationDisabled;
	} else delete touch.piecesRotationDisabled;
}

function scramble() {
	timer.clear();
	let randomInt = n => parseInt(Math.random() * n);
	applyMoves(Array(10*getCubeSize()+randomInt(10)).fill(0).map(i=>"LMRUEDBSFlrudbf".charAt(randomInt(15))+"'2".charAt(randomInt(3))).join(""), 0);
	history.clear();
	timer.prepare();
}
scrambleButton.onclick = scramble;


const history = {
	data: [],
	current: 0,
	add: move => {
		if (history.current && history.data[history.current-1] == reverseMove(move)) { // same move back and forth => go back
			history.current--;
		} else if (history.current && history.data[history.current-1] == move) { // same move twice => set modifier "2"
			history.data[history.current-1] = move.replace("'","")+"2";
			if (history.current > 1 && history.data[history.current-1] == history.data[history.current-2]) history.current-=2;
		} else if (history.current && history.data[history.current-1].replace(/['2]$/, "") == move.replace(/['2]$/, "")) { // 90° + 180° = -90°
			let reverse = reverseMove(move);
			history.data[history.current-1] = reverse == move ? reverseMove(history.data[history.current-1]) : reverse;
		} else if (move == history.data[history.current]) { // move was already the next one in history
			history.current++;
		} else {
			history.data.length = history.current;
			history.data.push(move);
			history.current++;
		}
		history.update();
		save.delayed();
	},
	back: _=> {
		if (touch.piecesRotationDisabled) return;
		if (history.current) applyMoves(reverseMove(history.data[history.current-1]));
	},
	forward: _=> {
		if (touch.piecesRotationDisabled) return;
		applyMoves(history.data[history.current]);
	},
	clear: _=> {
		history.data.length = history.current = 0;
		history.update();
	},
	update: _=> {
		let input = document.getElementById("history");
		input.value = history.data.slice(0, history.current).join(" ");
		input.scrollLeft = input.scrollWidth;
		backward.disabled = history.current == 0;
		forward.disabled = history.data.length == history.current;
	}
}
backward.onclick = history.back;
forward.onclick = history.forward;


function getOrderedStickers() {
	let stickers = [], faces = FACES.map(f=>f.name).sort((a, b) => a.charCodeAt(0)-b.charCodeAt(0));
	pieces.sort((a, b) => a.x-b.x || a.y-b.y || a.z-b.z).forEach(p => faces.forEach(f => p.s[f] && stickers.push(p.s[f])));
	return stickers;
}
const save = {
	timeout: null,
	animate: _=> {
		saveIcon.className = "";
		saveIcon.offsetWidth;
		saveIcon.className = "saved";
	},
	delayed: _=> {
		clearTimeout(save.timeout);
		save.timeout = setTimeout(save.save, 2e3);
	},
	save: _=> {
		finishAnimation();
		clearTimeout(save.timeout);
		let stickers = getOrderedStickers().map(s=>s.classList[1].charAt(0)).join("");
		localStorage.setItem("rubikscube", [getCubeSize(), stickers, history.data.join(), history.current].join(";"));
		save.animate();
	},
	load: _=> {
		let data = localStorage.getItem("rubikscube");
		if (data) {
			data = data.split(";");
			if (data.length == 4 && data[1].length == data[0]**2*6) {
				let colors = Object.fromEntries(FACES.map(f=>[f.color.charAt(0), f.color]));
				buildCube(cubeSize.value = data[0]);
				getOrderedStickers().forEach((s, i) => s.classList.replace(s.classList[1], colors[data[1].charAt(i)]));
				history.data = data[2] ? data[2].split(",") : [];
				history.current = parseInt(data[3]);
				history.update();
				return true;
			}
		}
	},
	erase: _=> localStorage.removeItem("rubikscube")
}
save.load();
onbeforeunload = save.save;
onvisibilitychange = _=> document.hidden ? save.save() : null;


const helper = {
	show: str => help.innerHTML = str,
	hide: _=> help.innerHTML = "",
	click: e => {
		if (![helpButton, help].includes(e.target)) return;
		help.innerHTML ? helper.hide() : helper.show(helper.get());
	},
	get: _=> {
		let cubeSize = getCubeSize();
		let facesCompleted = helper.facesCompleted();
		if (facesCompleted.length == 6) return "The puzzle is resolved. Scramble it.";
		if (facesCompleted.length == 0) return "First solve one face (with its crown).";
		if (cubeSize == 2) return "Now the other face.";
		else {
			let max = Math.max.apply(null, facesCompleted.map(([name, color]) => helper.internalLayersCompleted(name)));
			if (cubeSize == 3) {
				if (max) return "Internal layer done. Now the last face.";
				else return "First face done. Now the internal layer.";
			} else {
				switch (max) {
					case 0: return "First face done. Now the internal layers.";
					case cubeSize-2: return "Internal layers done. Now the last face.";
					default: return max+" internal layer"+(max==1?"":"s")+" done. One more.";
				}
			}
		}
	},
	facesCompleted: _=> {
		let max = getMaxCoord();
		let completedFaces = [];
		FACES.forEach(f => {
			let [axis, coord] = Object.entries(f).filter(([k,v])=>Math.abs(v))[0];
			let pieces = getPieces([axis, coord*max]);
			let orientations = helper.piecesOriented(pieces);
			if (orientations) completedFaces.push([f.name, orientations[f.name]]);
		});
		return completedFaces;
	},
	internalLayersCompleted: face => {
		let max = getMaxCoord();
		let [axis, coord] = Object.entries(FACES.filter(f=>f.name==face)[0]).filter(a=>parseInt(a[1]))[0];
		for (let i=1 ; i<max*2 ; i++) {
			let pieces = getPieces([axis, (max-i)*coord]);
			if (!helper.piecesOriented(pieces)) return i-1;
		}
		return max*2-1;
	},
	piecesOriented: (pieces) => {
		let facesColor = {};
		for (let i=pieces.length-1 ; i>=0 ; i--) {
			for (let j=0 ; j<6 ; j++) {
				let face = pieces[i].e.children[j], sticker = face.firstChild, name = face.classList[1], color = sticker && sticker.classList[1];
				facesColor[name] ||= color;
				if (color && facesColor[name] != color) return false;
			}
		}
		return facesColor;
	}
}
helpButton.onclick = helper.click;


const timer = {
	clear: _=> timer.running = timer.ready = false,
	prepare: _=> timer.ready = true,
	move: _=> {
		if (timer.ready) timer.start();
		else if (timer.running && helper.piecesOriented(pieces)) timer.stop();
	},
	start: _=> {
		timer.startTime = performance.now();
		timer.ready = false;
		timer.running = true;
	},
	stop: _=> {
		timer.running = false;
		helper.show("Solved in "+timer.format(performance.now() - timer.startTime)+".");
	},
	format: ms => {
		let m = ms/6e4|0, s = ms*.001%60|0;
		return (m ? m + " minutes " : "") + s + " seconds";
		//return m+":"+(s>9?s:"0"+s)+"."+String(ms%1e3|0).padStart(3,0);
	}
}


let frames=0, seconds=0, last=0, slowFrames=0;
function fpsCounter(now) {
	if (now*.001 < seconds+1) frames++;
	else {
		fps.innerText = frames;
		seconds = parseInt(now*.001);
		frames = 1;
	}
	requestAnimationFrame(fpsCounter);
	
	if (now-last > 40 && !document.hidden) {
		slowFrames++;
		if (slowFrames == 5 && !cube.classList.contains("flat")) {
			cube.classList.add("flat");
			helper.show("Low framerate detected.<br>Switched to simpler graphics mode.");
		}
	} else slowFrames=0;
	last = now;
}
fpsCounter(0);


class Vector {
	static rotateX(vector, angle) {
		let sin = Math.sin(angle), cos = Math.cos(angle);
		return [
			vector[0],
			vector[1]*cos - vector[2]*sin,
			vector[1]*sin + vector[2]*cos
		];
	}
	static rotateY(vector, angle) {
		let sin = Math.sin(angle), cos = Math.cos(angle);
		return [
			vector[0]*cos + vector[2]*sin,
			vector[1],
			-vector[0]*sin + vector[2]*cos
		];
	}
	static rotateZ(vector, angle) {
		let sin = Math.sin(angle), cos = Math.cos(angle);
		return [
			vector[0]*cos - vector[1]*sin,
			vector[0]*sin + vector[1]*cos,
			vector[2]
		];
	}
}

	static easeInCubic = t=>t**3;
	static easeOutCubic = t=>1-(1-t)**3;
	static easeInOutCubic = t=>t<.5 ? 4*t**3 : 1-(-2*t+2)**3/2;
}
