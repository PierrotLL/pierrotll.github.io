<!DOCTYPE html>
<link rel="icon" type="image/png" href="icon-512.png" />
<title>Piano</title>

<link rel="manifest" href="piano.webmanifest" />
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("piano-sw.js");</script>

<style>
body {
	--G-clef: url("GClef.svg");
	--F-clef: url("FClef.svg");
	--circle: "\2B24";
	--sharp: "\266F";
	--flat: "\266D";
}

main {
	display: flex;
	flex-direction: column;
	align-items: center;
	width: max-content;
	margin: auto;
	font: calc(min(2vh, 3.5vw)) arial;
}

#partition, #keyboard {
	list-style: none;
	margin: 0;
	padding: 0;
}

#partition {
	width: 80%;
}

#partition.G :nth-child(4 of .line):before {
	content: "";
	position: absolute;
	background: var(--G-clef) no-repeat;
    background-size: auto 100%;
	height: 6em;
	width: 100%;
	top: -3.9em;
	left: 0;
}
#partition.F :nth-child(2 of .line):before {
	content: "";
	position: absolute;
	background: var(--F-clef) no-repeat;
    background-size: auto 100%;
	height: 3em;
	width: 100%;
	top: -0.9em;
	left: 0;
}

#partition li {
	margin: .35em auto;
	line-height: 0;
	font-size: 2em;
	text-align: center;
	border: solid 1pt black;
	position: relative;
}

#partition .interline {
	border-color: transparent;
}

#partition .overline{
	width: 1em;
}
#partition :empty + .overline:empty:has(+ * + .overline + * + .line),
#partition :empty + :empty + :empty + .overline:empty:has(+ * + .line),
#partition .line + * + .overline:empty:has(+ :empty + :empty + :empty),
#partition .line + * + .overline + * + .overline:empty:has(+ :empty)
	{ border-color: transparent; }

#keyboard {
	margin-top: 4em;
}

#keyboard .white, #keyboard .black {
	position: relative;
	float: left;
	border: solid 2pt;
	border-radius: 0 0 8pt 8pt;
	box-sizing: border-box;
}

#keyboard .white {
	height: 14em;
	width: 3.43em;
	background: #fafafa;
}

#keyboard .white:active {
	background: linear-gradient(to bottom, #fff 0%, #bbb 100%);
}

#keyboard .black {
	height: 8em;
	width: 2em;
	margin-left: -1em;
	z-index: 1;
	background: #444;
}

#keyboard .black:active {
	background: linear-gradient(to bottom, #666 0%, #000 100%);
}

#keyboard :is(.A,.B,.D,.E,.G) {
	margin-left: -1em;
}

#popup {
	z-index: 2;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	border: solid 3pt black;
	border-radius: 30pt;
	padding: 30pt;
	background: white;
	box-shadow: 0 0 12pt;
	text-wrap: nowrap;
}
#opts {
	margin: 0;
	display: flex;
	flex-direction: column;
}
#opts div {
	display: flex;
	flex-direction: row;
	flex-grow: 1;
}
input {
	margin: 12pt;
	appearance: none;
	width: 2em;
	height: 2em;
	border: solid 2pt black;
	border-radius: 8pt;
	flex-grow: 1;
	font-size: 2em;
	text-align: center;
	line-height: 1.9;
}
input[value=G] {
	background: center var(--G-clef) no-repeat;
	background-size: auto 95%;
}
input[value=F] {
	background: center var(--F-clef) no-repeat;
	background-size: auto 50%;
}
input[name=sharp][value=off]:before {
	content: var(--circle);
}
input[name=sharp][value=on]:before {
	content: var(--sharp) var(--flat);
}
input:checked {
	border-color: blue;
	background-color: LightCyan;
}
#timer {
	font: bold 5em arial;
}
#replay {
	font-size: 1em;
	width: 100%;
	margin: 1em 0 0 0;
}
</style>

<main>
	<h1 id=hud hidden>
		<font style="color:green">Correct: <span id=correct></span><font style="font-size:.5em">/100</font></font><br />
		<font style="color:red">Wrong: <span id=wrong></span></font><br />
		<font style="color:yellow">Avg: <span id=avg></span></font>
	</h1>
	<ul id=partition></ul>
	<ul id=keyboard></ul>
	<div id=popup>
		<form id=opts>
			<div>
				<input type=radio name=clef value=G checked />
				<input type=radio name=clef value=F />
			</div>
			<div>
				<input type=radio name=sharp value=off checked />
				<input type=radio name=sharp value=on />
			</div>
			<div>
				<input type=submit value=Play />
			</div>
		</form>
		<span id=timer hidden></span>
		<h1 id=result hidden>
			Score: <span id=score></span><br />
			Best: <span id=best></span><br />
			<input type=button id=replay value=Replay />
		</h1>
	</div>
</main>

<script>
opts.onsubmit = e=> {
	e.preventDefault();
	opts.style.display = "none";
	partition.className = opts.clef.value;
	init();
	start();
}

function init() {
	hud.removeAttribute("hidden");
	partition.innerHTML = "";
	let lines = 5, over=2;
	for (let i=0, l=(lines+over*2)*2+1 ; i<l ; i++) {
		let li = document.createElement("li");
		li.className = i%2==1 ? (i<over*2||i>(lines+over)*2) ? "overline" : "line" : "interline";
		partition.appendChild(li);
	}
	
	keyboard.innerHTML = "";
	let keys=["C B#","C# Db","D","D# Eb","E Fb","F E#","F# Gb","G","G# Ab","A","A# Bb","B Cb"];
	for (let i=0 ; i<keys.length ; i++) {
		let li = document.createElement("li");
		li.className = (keys[i].split(" ")[0].length==1 ? "white" : "black") + " " + keys[i];
		keyboard.appendChild(li);
	}
}

let prev, correct, wrong, elapsed;
function start() {
	correct = wrong = elapsed = 0;
	prev = null;
	timer.removeAttribute("hidden");
	let seconds = 3;
	(function countdouwn() {
		if (seconds) {
			timer.innerHTML = seconds--;
			setTimeout(countdouwn, 1000);
		} else {
			timer.setAttribute("hidden", true);
			popup.setAttribute("hidden", true);
			play();
		}
	})();
	updateHud();
}
function updateHud() {
	document.getElementById("correct").innerHTML = correct;
	document.getElementById("wrong").innerHTML = wrong;
	avg.innerHTML = correct ? (elapsed/correct*.001+"").replace(/(\.\d{3}).*/, "$1")+"s" : "";
}
function play() {
	let n;
	do { n = Math.random() * partition.children.length-.5; } while (Math.round(n) == prev);
	let line = Math.round(n);
	prev = line;
	let clefline = Array.from(partition.children).indexOf(partition.querySelectorAll(".line")[{G:3,F:1}[partition.className]]);
	let note = String.fromCharCode(((clefline-line+70+partition.className.charCodeAt(0)-"A".charCodeAt(0))%7) + "A".charCodeAt(0));
	let mod = opts.sharp.value=="on" ? n-line < -.3 ? "#" : n-line > .3 ? "b" : "" : "";
	note += mod;
	console.log("line:",line,"note:",note, n);
	partition.children[line].innerHTML = (mod=="#"?"&#9839;":mod=="b"?"&#9837;":"")+"&#11044;";
	
	let start = performance.now();
	keyboard.onclick = e=>{
		if (e.target.className.split(" ").indexOf(note) >= 0) {
			correct++;
			elapsed+=performance.now()-start;
			partition.children[line].innerHTML = "";
			if (correct==100) complete();
			else play();
		} else wrong++;
		updateHud();
	}
}

function getScore(clef, sharp, correct, wrong, elapsed) {
	return Math.floor(1e6/(elapsed/correct/(sharp?1.5:1)+wrong*100));
}
function complete() {
	popup.removeAttribute("hidden");
	result.removeAttribute("hidden");
	
	let clef = opts.clef.value;
	let sharp = opts.sharp.value=="on";
	let score = getScore(clef, sharp, correct, wrong, elapsed);
	let best = "";
	let name = "piano-"+clef+(sharp?"#":"");
	let save = localStorage.getItem(name);
	if (save) {
		save = save.split(" ");
		best = getScore(clef, sharp, save[0], save[1], save[2]);
	}
	if (score > best) localStorage.setItem(name, correct+" "+wrong+" "+elapsed);
	score.innerHTML = score+(score>best?"&#128081;":"");
	best.innerHTML = best;
	replay.onclick = _=> {
		result.setAttribute("hidden", true);
		start();
	}
}
</script>
