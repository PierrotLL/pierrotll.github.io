<canvas id=cnv></canvas>
<script>
document.body.style.margin = 0;
cnv.width = innerWidth;
cnv.height = innerHeight;
cnv.style = "width:"+innerWidth+"px;height:"+innerHeight+"px";
const ctx = cnv.getContext("2d");
ctx.fillStyle = "#000";

const cells = [], SIZE=2, INT_WIDTH = Math.ceil(cnv.width/SIZE/31), PX_WIDTH = INT_WIDTH*31, PX_HEIGHT = Math.ceil(cnv.height/SIZE);
function display() {
	ctx.clearRect(0, 0, cnv.width, cnv.height);
	for (let i = 0, l = cells.length ; i<l ; i++) {
		if (cells[i]) {
			let x = i%INT_WIDTH*31, y = i/INT_WIDTH|0, n = cells[i], bit = 30;
			while (n) {
				if (n & 1) ctx.fillRect((x + bit) * SIZE, y * SIZE, SIZE, SIZE);
				n >>= 1;
				bit--;
			}
		}
	}
}
function set(x, y, v) {
	if (x>=0 && x<PX_WIDTH && y>=0 && y<PX_HEIGHT) {
		let i = (y|0)*INT_WIDTH + (x/31|0), mask = 1 << (30-x%31);
		if (v) cells[i] |= mask;
		else cells[i] &= ~mask ^ (1<<31);
	}
}
function step() {
	let prox = [];
	for (let i = 0, l = cells.length ; i<l ; i++) {
		if (cells[i]) {
			let x = i%INT_WIDTH*31, y = i/INT_WIDTH|0, n = cells[i], bit = 30;
			while (n) {
				if (n & 1) for (let d=0 ; d<9 ; d++) {
					let j = (y-1+(d/3|0))*PX_WIDTH + (x+bit+d%3-1);
					if (j>=0) prox[j] = (prox[j]|0) + (d!=4);
				}
				n >>= 1;
				bit--;
			}
		}
	}
	for (let i=0, l = prox.length ; i<l ; i++) {
		if (prox[i] == 3) set(i%PX_WIDTH, i/PX_WIDTH, 1);
		else if (prox[i]<2 || prox[i]>3) set(i%PX_WIDTH, i/PX_WIDTH, 0);
	}
}
function init() {
	let cx = PX_WIDTH/2|0, cy = PX_HEIGHT/2|0, r = Math.min(PX_WIDTH, PX_HEIGHT)*.3|0;
	let x=r, y=0, p=1-r;
	while (x >= y) {
		for (let i=-x ; i<=x ; i++) {
			if (Math.random()<.5) set(cx+i, cy-y, 1);
			if (Math.random()<.5) set(cx+i, cy+y, 1);
		}
		if (p>0) for (let i=-y ; i<=y ; i++) {
			if (Math.random()<.5) set(cx+i, cy-x, 1);
			if (Math.random()<.5) set(cx+i, cy+x, 1);
		}
		x = x - (p>0 ? 1 : 0);
		y++;
		p += p>0 ? 1-2*x+2*y : 1+2*y;
	}
}
function loop() {
	step();
	display();
	requestAnimationFrame(loop);
}
init();
loop();
</script>
