<!DOCTYPE html>
<title>&#128241; Games by PierrotLL</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=3.0" />

<style>
html, body {
	margin: 0;
	height: 100svh;
	background: #000;
	font: 14px sans-serif;
	color: white;
	contain: content;
}
main {
	height: 100svh;
	background:
		linear-gradient(160deg, #00000000 55%, #000020F0 75%), /* shadow */
		radial-gradient(farthest-side circle at 50% 160%, #00872590 50%, #00872550 65%, #FFD30040 68%, #00000000 70%), /* planet colors */
		radial-gradient(farthest-side circle at 50% 160%, #004, #004 69%, #00000000 70%), /* planet mask */
		repeating-radial-gradient(at  0% -20%, #004 0%, #004 1.5%, #00000000 1.9%, #00000000 2.1%, #004 2.5%), /* stars mask */
		repeating-radial-gradient(at 98%  67%, #004 0%, #004 1.5%, #00000000 1.9%, #00000000 2.1%, #004 2.5%),
		repeating-linear-gradient( 45deg, #004 0%, #004 3.7%, #00000000 4%, #004 4.3%), /* stars grid */
		repeating-linear-gradient(-45deg, #004 0%, #004 2.7%, #FFFFFFFF 3%, #004 3.3%);
	user-select: none;
	overflow: hidden; /* prevent scrollbar overflowing border-radius */
}
@media (any-pointer: fine) and (hover: hover) { /* if PC, page looks like a phone */
	body { background: light-dark(#fff, #222) }
	main {
		aspect-ratio: 9 / 16;
		height: calc(900px - 32px); /* 2x 15px shadow + 1px border */
		margin: calc(15px + 5px) auto; /* 15pw shadow + 5px margin */
		border: solid 1px gray;
		border-radius: 90px;
		outline: solid 5px black;
		box-shadow: -4px -4px 2px 1px white, 0 0 3px 12px #444;
		box-shadow: -4px -4px 2px 1px white, 0 0 3px 12px light-dark(#444, #666);
	}
}
@media (prefers-color-scheme: dark) {
	body { background: #222 }
	main { box-shadow: -4px -4px 2px 1px white, 0 0 3px 12px #666 }
}
nav {
	box-sizing: border-box;
	height: 100%;
	padding: calc(100% / 110 * 3); /* Screen width divided into 110ths. App icon = 16*110ths, space between=10*110ths, space around=8*110ths */
	overflow: auto;
	scrollbar-width: none;
}
h1 {
	font-size: 48px;
	font-weight: bold;
	text-align: center;
}
grid {
	display: grid;
	grid-template-columns: repeat(4, minmax(0, 1fr));
}
app {
	display: block;
	margin: calc(100% * 5 / 26);
	cursor: pointer;
	transition: scale .1s;
}
app:active:not(.open) {
	scale: .9;
}
app > :first-child {
	display: block;
	width: 100%;
	aspect-ratio: 1;
	border-radius: 25%;
}
img {
	background: lightgray;
}
name {
	display: block;
	position: relative;
	width: 150%;
	left: -25%;
	margin-top: .6em;
	height: 1.2em;
	font-size: 14px;
	text-align: center;
}

folder {
	display: block;
	background: #222;
	pointer-events: none;
	box-sizing: border-box;
	padding: 9%;
	transition: padding .5s;
}
folder grid {
	grid-template-columns: repeat(3, auto);
}
folder app {
	margin: 5%;
}
folder app:nth-child(n+10) {
	display: none;
}
folder name {
	display: none;
}

nav.hasopen {
	overflow: unset;
}
nav.hasopen > h1, nav.hasopen > grid > :not(.open) {
	display: none;
}
nav.hasopen > grid {
	display: block;
	box-sizing: border-box;
	height: 100%;
	padding: calc(100% / 104 * 13);
}
app.open {
	height: 100%;
	box-sizing: border-box;
	margin: 0;
	padding-top: 70px;
	position: relative;
	cursor: auto;
}
.open folder {
	background: none;
	border-radius: unset;
	aspect-ratio: unset;
	pointer-events: unset;
	overflow: auto;
	scrollbar-width: none;
	height: 100%;
	padding: 0;
	border-top: solid 1px #80808080;
	border-bottom: solid 1px #80808080;
}
@media (min-aspect-ratio: 1.35) and (hover: none) {
	.open folder { height:unset; overflow: unset; }
	nav.hasopen { overflow: auto; }
}
.open > name {
	position: absolute;
	top: 0;
	left: 0;
	font-size: 32px;
	text-align: left;
}
.open folder grid {
	grid-template-columns: repeat(3, minmax(0, 1fr));
}
app.open app {
	margin: calc(100% * 5 / 26);
}
app.open app {
	display: block;
}
.open app name {
	display: block;
}
</style>
<main>
	<nav>
		<h1>My Apps</h1>
		<grid>
			<app href="./solitaire/solitaire.html">
				<img src="./solitaire/icon-192-bg.webp"/>
				<name>Peg-Solitaire</name>
			</app>
			<app href="./rubikscube/rubikscube.html">
				<img src="./rubikscube/icon-192.png"/>
				<name>Rubik's Cube</name>
			</app>
			<app href="./piano/piano.html">
				<img src="./piano/icon-192.webp"/>
				<name>Piano Trainer</name>
			</app>
			<app>
				<folder>
					<grid>
						<app href="./experiments/SudokuSolver.html">
							<img src="./experiments/sudoku.webp"/>
							<name>Sudoku Solver</name>
						</app>
						<app href="./experiments/collisions.html">
							<img src="./experiments/collisions.webp"/>
							<name>Collisions</name>
						</app>
						<app href="./experiments/shifumi.html">
							<img src="./experiments/shifumi.webp"/>
							<name>Shifumi</name>
						</app>
						<app href="./experiments/raycasting.html">
							<img src="./experiments/raycasting.webp"/>
							<name>Raycasting</name>
						</app>
						<app href="./experiments/cube.html">
							<img src="./experiments/cube.webp"/>
							<name>Cube</name>
						</app>
						<app href="./experiments/planet.html">
							<img src="./experiments/planet.webp"/>
							<name>Planet</name>
						</app>
					</grid>
				</folder>
				<name>Experiments</name>
			</app>
		</grid>
	</nav>
</main>
<script>
let nav = document.querySelector("nav"), navScrollTop;
onclick = e=>{
	let app = e.target.closest("app"), url = app && app.getAttribute("href"), open = document.querySelector(".open"), scrollTop = nav.scrollTop;
	if (url) window.location = url;
	else if (app) open = app.classList.toggle("open") ? app : null;
	else if (open) open = open.classList.remove("open");
	nav.classList.toggle("hasopen", open);
	if (open) [navScrollTop, nav.scrollTop, open.firstElementChild.scrollTop] = [scrollTop, 0, 0]
	else if (navScrollTop) [nav.scrollTop, navScrollTop] = [navScrollTop, undefined];
}
</script>
