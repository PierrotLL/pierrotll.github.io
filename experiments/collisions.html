<!DOCTYPE html>
<meta name="viewport" content="width=device-width,initial-scale=0.5" />
<style>
html, body { background:lightblue; width:100vw; height:100svh; margin:0; contain:content; }
.particle {
	position: absolute;
	aspect-ratio: 1;
	border-radius: 50%;
	translate: -50% -50%;
}
input {
	position: absolute;
	bottom: 50px;
	left: 50%;
	translate: -50% 0;
	width: min(500px, 90vw);
	z-index: 1;
}
</style>
<input type=range min=20 max=300 value=150 autocomplete="off" oninput="let r=Number(this.value); biggy.radius=r; biggy.mass=r**1.5; biggy.element.style.width=r*2+'px';" />
<script>
const particles = [];
function addParticle(opts) {
	const o = Object.assign({
		radius: Math.random()*20+20,
		x: Math.random() * document.body.offsetWidth,
		y: Math.random() * document.body.offsetHeight,
		dx: Math.random()*4-2,
		dy: Math.random()*4-2,
		color: "hsl("+(Math.random()*360)+" 100% 30%)",
	}, opts);
	particles.push(Object.assign(o, {
		mass: o.radius**1.5,
		element: document.body.appendChild(
			Object.assign(
				document.createElement("div"),
				{ className: "particle", style: "background:"+o.color+"; width:"+(o.radius*2)+"px;" }
			)
		),
	}));
	return o;
}
let lastTime;
function frame(now) {
	lastTime ||= now;
	let elapsed = Math.min(now - lastTime, 500);
	lastTime = now;
	for (let i=0, l=particles.length ; i<l ; i++) {
		let p = particles[i];
		for (let j=i+1 ; j<l ; j++) {
			let p2 = particles[j],
				dx = p2.x-p.x,
				dy = p2.y-p.y,
				h = p2.radius+p.radius;
			if (dx*dx+dy*dy <= h*h) {
				let angle = Math.atan2(dy, dx),
					cos = Math.cos(angle),
					sin = Math.sin(angle);
				p.x = p2.x-h*cos;
				p.y = p2.y-h*sin;
				let nx = (p.x-p2.x)/h,
					ny = (p.y-p2.y)/h,
					v = 2 * (p.dx*nx + p.dy*ny - p2.dx*nx - p2.dy*ny) / (p.mass+p2.mass);
				p.dx  -= v*nx*p2.mass;
				p.dy  -= v*ny*p2.mass;
				p2.dx += v*nx*p.mass;
				p2.dy += v*ny*p.mass;
			}
		}
		if (p.x-p.radius <= 0) p.dx = Math.abs(p.dx);
		if (p.x+p.radius >= document.body.offsetWidth) p.dx = -Math.abs(p.dx);
		if (p.y-p.radius <= 0) p.dy = Math.abs(p.dy);
		if (p.y+p.radius >= document.body.offsetHeight) p.dy = -Math.abs(p.dy);
		p.x += p.dx * elapsed*.001*60;
		p.y += p.dy * elapsed*.001*60;
		p.element.style.left = p.x+"px";
		p.element.style.top = p.y+"px";
	}
	requestAnimationFrame(frame);
}
let biggy;
document.addEventListener("DOMContentLoaded", _=> {
	for (let i=0 ; i<120 ; i++) addParticle();
	biggy = addParticle({radius:Number(document.querySelector("input").value), x:document.body.offsetWidth/2, y:document.body.offsetHeight/2});
	frame(1);
});
</script>
