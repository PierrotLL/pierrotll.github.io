<!DOCTYPE html>
<title>Rubik's Cube</title>
<link rel="icon" type="image/png" href="icon-512.png" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,interactive-widget=resizes-content" />

<link rel="manifest" href="rubikscube.webmanifest" />
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("rubikscube-sw.js");</script>

<style>
html { height: 100% }
body {
	position: relative;
	margin: 0;
	min-height: 100%;
	background: black;
	font-family: sans-serif;
	font-size: 16px;
	color: black;
}

#scene {
	position: fixed;
	z-index: 0;
	width: 100dvw; /* dynamic viewport, resize with visual keyboard */
	height: 100dvh;
	contain: strict;
	user-select: none;
	perspective: 1200px;
	font-size: min(60vmin, max(40vmin, 25vh)); /* cube size */
	background: radial-gradient(circle at 50% calc(50% + 15vmin), #999, #000);
	cursor: move;
}
#scene * {
	transform-style: preserve-3d;
	cursor: grab;
}
body.grabbing * {
	cursor: grabbing !important;
}

#cube {
	position: fixed;
	top: 50dvh;
	left: 50dvw;
}
.will-transform, .will-transform > div { will-change: transform }

.face {
	width: 1em;
	height: 1em;
	position: absolute;
	background: black;
	border-radius: 15%;
	translate: -50% -50%;
    outline: 1px solid transparent; /* webkit aliasing */
}
.up { transform: rotateX(90deg) translateZ(.5em) }
.down { transform: rotateX(-90deg) translateZ(.5em) }
.back { transform: rotateY(180deg) translateZ(.5em) }
.front { transform: translateZ(.5em) }
.left { transform: rotateY(-90deg) translateZ(.5em) }
.right { transform: rotateY(90deg) translateZ(.5em) }
.inner { border-radius: 0 }
.x { transform: rotateY(90deg) }
.y { transform: rotateX(90deg) }

.sticker {
	margin: .05em;
	aspect-ratio: 1;
	border-radius: 15%;
	backface-visibility: hidden;
	transform: translateZ(1px);
	box-shadow: inset .02em .02em .05em rgba(255,255,255,.5), inset -.02em -.02em .05em rgba(0,0,0,.5);
    outline: 1px solid transparent; /* webkit aliasing */
}
.red { background: red }
.orange { background: orange }
.yellow { background: yellow }
.white { background: white }
.blue { background: blue }
.green { background: green }

[x*="0"][y*="0"]:not([z^="-"]) .front .sticker:before {content:"F"; font-size:.4em; position:absolute;top:50%;left:50%;translate:-50% -50%;}

.flat .face { border-radius: 0; backface-visibility: hidden; outline: none; }
.flat .inner { display: none; }
.flat .sticker { box-shadow: none; outline: none; }


#menu {
	display: inline-block;
	padding: 1em;
	margin-bottom: 3em;
	transition: .4s;
	max-height: 2em;
	contain: paint;
}
#menu div, #menu form { display: flex; gap: .3em }
label {
	display: block;
	margin-top: .5em;
	color: white;
}
input, select, button {
	box-sizing: border-box;
	padding: .5em 1em;
	font-size: inherit;
	text-align: center;
	color: black;
}
select, input[type="text"] { width: 9em }


#helpButton {
	position: absolute;
	bottom: 0;
	margin: 1em;
	padding: 0 !important;
	contain: content;
	min-width: 2em;
	min-height: 2em;
	--max-width: min(calc(100vw - 2em), 500px);
	border-radius: 1em;
	border: solid 1px white;
	background: linear-gradient(aqua, navy);
	color: white;
	display: flex;
	align-items: center;
}
#helpButton:active { background: navy }
#helpButton:before {
	content: "?";
	font-size: 1.5em;
	font-weight: bold;
	width: calc(2em / 1.5 - 2px);
}
#helpButton > div {
	max-width: calc(var(--max-width) - 2em);
	max-height: 10em;
	transition: max-width .5s, max-height .5s .5s;
}
#helpButton > div:has(:empty) {
	max-width: 0;
	max-height: calc(2em - 2px);
}
#help {
	box-sizing: border-box;
	width: max-content;
	height: max-content;
	max-width: calc(var(--max-width) - 2em);
	padding: .25em;
	text-align: left;
}
#help:empty { padding: 0 }


#fps {
	pointer-events: none;
	position: fixed;
	top: 0;
	right: 0;
	color: grey;
	font-size: .75em;
}
#fps:before { content: "FPS:" }


#saveIcon {
	pointer-events: none;
	position: fixed;
	bottom: 0;
	right: 0;
	margin: 1em;
	opacity: 0;
}
.saved { animation: 1s linear saved }
@keyframes saved {
	 20% { opacity: 1 }
	 80% { opacity: 1 }
	100% { opacity: 0 }
}
</style>

<body>
	<div id=scene>
		<div id=cube></div>
	</div>
	
	<div id=menu>
		<button onclick="[menu.style.maxHeight, this.firstChild.style.rotate] = menu.style.maxHeight ? ['', ''] : ['16em', '45deg']"><div style="transition:.4s">+</div></button>
		<label for=cubeSize>Cube size</label>
		<div>
			<select id=cubeSize onchange="buildCube(this.value); history.clear(); save.erase();">
				<option value=2>2x2x2</option>
				<option value=3>3x3x3</option>
				<option value=4>4x4x4</option>
				<option value=5>5x5x5</option>
			</select>
			<button onclick="shuffle()" style="flex-grow:1">Shuffle</button>
		</div>
		<label for=move>Movements input</label>
		<form onsubmit="parseInput(move.value); move.value=move.placeholder=''; return false">
			<input type=text id=move placeholder="L R' U2 d Fw x" autocomplete="off" />
			<input type=submit value="Apply" style="flex-grow:1" />
		</form>
		<label for=history>History</label>
		<div>
			<input type=text id=history autocomplete="off" disabled />
			<button id=backward onclick="history.back()" disabled>&lt;</button>
			<button id=forward onclick="history.forward()" disabled>&gt;</button>
		</div>
	</div>
	<button id=helpButton><div><div id=help></div></div></button>
	<div id=fps></div>
	<div id=saveIcon>&#128190;</div>
</body>

<script>
const AXIS = ["x", "y", "z"];
const FACES = [
	{name:"up", x:0, y:-1, z:0, color:"red"},
	{name:"down", x:0, y:1, z:0, color:"orange"},
	{name:"back", x:0, y:0, z:-1, color:"white"},
	{name:"front", x:0, y:0, z:1, color:"yellow"},
	{name:"left", x:-1, y:0, z:0, color:"green"},
	{name:"right", x:1, y:0, z:0, color:"blue"}];
const FACES_VECTOR = Object.fromEntries(FACES.map(f => [ f.name, [f.x, f.y, f.z] ]));

function buildCube(size) {
	cube.innerHTML = "";
	cube.style.fontSize = 1/size+"em";
	cube.classList.remove("flat");
	let max = Math.floor(size-1)/2;
	for (let x=-max ; x<=max ; x++) {
		for (let y=-max ; y<=max ; y++) {
			for (let z=-max ; z<=max ; z++) {
				if (Math.abs(x)==max || Math.abs(y)==max || Math.abs(z)==max) {
					let piece = document.createElement("div");
					piece.setAttribute("x", x);
					piece.setAttribute("y", y);
					piece.setAttribute("z", z);
					piece.style.transform = "translate3d("+x+"em,"+y+"em,"+z+"em)";
					FACES.forEach(f => {
						let face = document.createElement("div");
						face.className = "face "+f.name;
						if ((x && x == f.x*max) || (y && y == f.y*max) || (z && z == f.z*max)) {
							let sticker = document.createElement("div");
							sticker.className = "sticker "+f.color;
							face.append(sticker);
						}
						piece.append(face);
					});
					AXIS.forEach(axis => { // block view through border-radius
						let inner = document.createElement("div");
						inner.className = "face inner "+axis;
						piece.append(inner);
					});
					cube.append(piece);
				}
			}
		}
	}
}
buildCube(cubeSize.value = 3);

function getMaxCoord() {
	return Math.abs(cube.firstChild.getAttribute("x"));
}
function getCubeSize() {
	return Math.ceil(Math.cbrt(cube.childElementCount));
}

["mousedown", "touchstart"].forEach(type => scene.addEventListener(type, touchstart));
["mousemove", "touchmove"].forEach(type => window.addEventListener(type, touchmove, {passive: false}));
["mouseup", "click", "touchend", "touchcancel"].forEach(type => window.addEventListener(type, touchend));

const touch = {};
function touchstart(e) {
	if (touch.down) touchend();
	if (e.touches && e.touches.length > 1) {
		touch.startX = touch.lastX = [e.touches[0].clientX, e.touches[1].clientX];
		touch.startY = touch.lastY = [e.touches[0].clientY, e.touches[1].clientY];
	} else if (e.touches || e.buttons == 1) {
		touch.startX = touch.lastX = e.x || e.touches[0].clientX;
		touch.startY = touch.lastY = e.y || e.touches[0].clientY;
		touch.down = e.target.closest("#scene") != null;
		if (touch.down) cube.classList.add("will-transform");
		touch.face = e.target.closest(".face");
		if (touch.face) document.body.classList.add("grabbing");
	}
}
function touchmove(e) {
	if (e.touches && e.touches.length > 1) {
		let distance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
		let previous = Math.hypot(touch.lastX[0] - touch.lastX[1], touch.lastY[0] - touch.lastY[1]);
		rotateCube(rotation, tilt, scale * ((distance / previous - 1) * .5 + 1));
		touch.lastX = [e.touches[0].clientX, e.touches[1].clientX];
		touch.lastY = [e.touches[0].clientY, e.touches[1].clientY];
	} else if (touch.down) {
		if (e.touches) e.preventDefault(); // prevent refresh on mobile
		e.x ||= e.touches[0].clientX;
		e.y ||= e.touches[0].clientY;
		let pxToAngle = 360 / Math.min(window.innerWidth, window.innerHeight);
		if (touch.face && !touch.piecesRotationDisabled) {
			let vector = screenToSceneVector(e.x - touch.startX, e.y - touch.startY);
			if (Math.hypot.apply(null, vector)*pxToAngle > 5) touch.axis ||= getMoveAxis(touch.face.classList[1], vector);
			if (touch.axis) {
				finishAnimation();
				touch.selector ||= '['+touch.axis[0]+'="'+touch.face.parentElement.getAttribute(touch.axis[0])+'"]';
				touch.pieces ||= cube.querySelectorAll(touch.selector);
				touch.lastAngle = vector[touch.axis[1]] * touch.axis[2] * pxToAngle;
				
				//rotatePiecesTemporarily(touch.pieces, touch.axis[0], touch.lastAngle);
				/*	Brower may fire multiple move events in a single frame.
					The following lines ensure rotatePiecesTemporarily is called only once before next rendering. */
				cancelAnimationFrame(touch.animation);
				touch.animation = requestAnimationFrame(((pieces, axis, angle) => _=> rotatePiecesTemporarily(pieces, axis, angle))(touch.pieces, touch.axis[0], touch.lastAngle));
			}
		} else {
			rotateCube(rotation + (e.x - touch.lastX) * pxToAngle, tilt - (e.y - touch.lastY) * pxToAngle, scale);
		}
		touch.lastX = e.x;
		touch.lastY = e.y;
	}
}
function touchend(e) {
	if (touch.axis) {
		let toAngle = Math.round(touch.lastAngle / 90)*90;
		rotatePiecesAnimated(touch.pieces, touch.axis[0], touch.lastAngle, toAngle, .1, Ease.easeInCubic);
		toAngle = normalizeAngle(toAngle);
		if (toAngle) history.add(getMoveName(touch.selector, toAngle));
	}
	touch.down = false;
	touch.face = touch.axis = touch.selector = touch.pieces = null;
	cube.classList.remove("will-transform");
	document.body.classList.remove("grabbing");
}
window.addEventListener("wheel", e => rotateCube(rotation, tilt, scale - e.deltaY * .001));


const DEG_TO_RAD = Math.PI/180;
function normalizeAngle(a) {
	return (a%360-540)%360+180;
}

let rotation=0, tilt=0, scale=1;
function rotateCube(x, y, s) {
	rotation = normalizeAngle(x);
	tilt = Math.min(Math.max(y, -90), 90);
	scale = Math.min(Math.max(s, .5), 1.5);
	cancelAnimationFrame(touch.animation);
	touch.animation = requestAnimationFrame(_=> cube.style.transform = "rotateX("+tilt+"deg) rotateY("+rotation+"deg) scale3d("+scale+","+scale+","+scale+")");
}
rotateCube(-30, -20, 1);

function screenToSceneVector(dx, dy) {
	return Vector.rotateY(Vector.rotateX([dx, dy, 0], -tilt*DEG_TO_RAD), -rotation*DEG_TO_RAD);
}

function getMoveAxis(face, vector) { // return [ axis name (x|y|z), scene vector component to use for rotation angle (0|1|2), vector component factor (-1|1) ]
	let a = { up:[0,2],down:[2,0], front:[0,1],back:[1,0], left:[2,1],right:[1,2] }[face];
	if (a) return Math.abs(vector[a[0]]) > Math.abs(vector[a[1]]) ? [AXIS[a[1]], a[0], 1] : [AXIS[a[0]], a[1], -1];
}

function getFacesSwap(axis, angle) {
	let swap = {};
	let vector2Face = Object.fromEntries(Object.entries(FACES_VECTOR).map(([k,v])=>[v.join(),k]));
	for (let i in FACES_VECTOR) {
		let vector = Vector["rotate"+axis.toUpperCase()](FACES_VECTOR[i], -angle*DEG_TO_RAD).map(Math.round);
		swap[i] = vector2Face[vector.join()];
	}
	return swap;
}

function rotatePiecesTemporarily(pieces, axis, angle) {
	angle &&= normalizeAngle(angle);
	let rotation = angle ? "rotate"+axis+"("+angle+"deg) " : "";
	pieces.forEach(p=>p.style.transform = rotation+"translate3d("+AXIS.map(p.getAttribute,p).join("em,")+"em)");
}

function rotatePiecesPermanently(pieces, axis, angle) {
	if (normalizeAngle(angle) == 0) return rotatePiecesTemporarily(pieces, axis, 0);
	let swap = getFacesSwap(axis, angle);
	pieces.forEach(p => {
		let vector = Vector["rotate"+axis.toUpperCase()](AXIS.map(p.getAttribute,p), angle*DEG_TO_RAD).map(i=>Math.round(i*2)/2);
		AXIS.forEach((axis, i)=>p.setAttribute(axis, vector[i]));
		p.style.transform = "translate3d("+vector.map(i=>i+"em").join()+")";
		let stickers = Object.fromEntries(Array.from(p.getElementsByClassName("sticker")).map(sticker => [sticker.parentElement.classList[1], sticker]));
		p.childNodes.forEach(face => { let s = stickers[swap[face.classList[1]]]; if (s) face.append(s); });
	});
}

let animation;
function rotatePiecesAnimated(pieces, axis, fromAngle, toAngle, duration, ease) {
	if (!duration) return rotatePiecesPermanently(pieces, axis, toAngle);
	let start = performance.now(), end = start + duration*1e3;
	function frame(now) {
		let progress = Math.min((now-start)/(end-start), 1);
		if (progress < 1) {
			rotatePiecesTemporarily(pieces, axis, fromAngle + (toAngle-fromAngle) * ease(progress));
			animation.id = requestAnimationFrame(frame);
		} else finishAnimation();
	}
	animation = { id:requestAnimationFrame(frame), pieces:pieces, axis:axis, toAngle:toAngle };
}
function finishAnimation() {
	if (animation) {
		cancelAnimationFrame(animation.id);
		rotatePiecesPermanently(animation.pieces, animation.axis, animation.toAngle);
		animation = null;
	}
}


function getMoveName(selector, angle) {
	let max = getMaxCoord();
	let axis = selector.charAt(1);
	let coord = parseFloat(selector.slice(4, -2));
	let move = {
		x: [ ["L",-1],["M",-1],["R",1] ],
		y: [ ["U",-1],["E",1],["D",1] ],
		z: [ ["B",-1],["S",1],["F",1] ]
	} [axis][Math.abs(coord)/(coord||1)+1];
	let name = move[0];
	if (coord && Math.abs(coord) < max) name = name.toLowerCase();
	if (Math.abs(angle) == 180) name += 2;
	else if (angle * move[1] < 0) name += "'";
	return name;
}

function reverseMove(move) {
	let [match, name, modifier] = move.match(/(\d*[xLlMmRryUuEeDdzBbSsFf]w?)('|2)?/i);
	return modifier==2 ? match : modifier=="'" ? name : name+"'";
}

function parseInput(str) {
	let cubeSize = getCubeSize();
	let moveRegex = /\d*[xLlMmRryUuEeDdzBbSsFf]w?['2]?/g;
	str = str.replaceAll(/[XYZ]/g, m=>m.toLowerCase()); // xyz always in lower case
	str = str.replaceAll(moveRegex, m=>" "+m); // add space between moves to avoid confusing pre/post numbers (slice number/turn quarters)
	str = str.replaceAll(/(\d+)([LRUDBF])/gi, (m,n,l)=>n==2 ? l.toLowerCase() : (n>2?n:"")+l.toUpperCase()); // 1r or 1R => R, 2R => r, 3r => 3R
	if (cubeSize == 2) str = str.replaceAll(/[MESw]/gi, "").replaceAll(/([lrudbf])/g, (m,l)=>l.toUpperCase()); // no inner slice nor wide move
	else if (cubeSize == 3) str = str.replaceAll(/([LRUDBF])w/gi, (m,l)=>l.toLowerCase()); // for 3x3x3 r means Rw
	else str = str.replace(/([lrudbf])w/g, (m,l)=>l.toUpperCase()+"w"); // rw is equivalent to Rw
	while (str.match(/\([^\(\)]+\)['\d]/)) { // nested groups
		str = str.replaceAll(/\(([^\(\)]+)\)('|\d+)/g, (m,s,n)=>parseInt(n) ? s.repeat(n) : s.match(moveRegex).map(reverseMove).join(""));
	}
	applyMoves(str);
}

function shuffle() {
	const randomInt = n => parseInt(Math.random() * n);  
	applyMoves(Array(10*getCubeSize()+randomInt(10)).fill(0).map(i=>"LMRUEDBSFlrudbf".charAt(randomInt(15))+"'2".charAt(randomInt(3))).join(""), 0);
	history.clear();
}

function applyMoves(str, duration=.4) {
	let match = str && str.match(/(\d*)([xyzLRUDBFmes])(w)?('|2)?/i);
	if (match) {
		let [move, depth, letter, wide, modifier] = match;
		let isLowerCase = letter == letter.toLowerCase();
		let max = getMaxCoord();
		let [axis, coord, angle] = {
			x: ["x", 0, 90],
			l: ["x", -1, -90],
			m: ["x", 0, -90],
			r: ["x", 1, 90],
			y: ["y", 0, -90],
			u: ["y", -1, -90],
			e: ["y", 0, 90],
			d: ["y", 1, 90],
			z: ["z", 0, 90],
			b: ["z", -1, -90],
			s: ["z", 0, 90],
			f: ["z", 1, 90],
		}[letter.toLowerCase()];
		if (max == 1 && isLowerCase) wide = true;
		depth ||= wide || isLowerCase ? 2 : 1;
		let selector = '['+axis+'="'+(coord*(max-depth+1))+'"]';
		if (wide) for (let i=0 ; i < depth-1 ; i++) selector += ',['+axis+'="'+(max-i)*coord+'"]';
		if ("mes".indexOf(letter) >= 0) selector = "[x]:not("+selector+")";
		if ("xyz".indexOf(letter) >= 0) selector = "["+axis+"]";
		if (modifier == "'") angle *= -1;
		if (modifier == "2") angle *= 2;
		finishAnimation();
		rotatePiecesAnimated(cube.querySelectorAll(selector), axis, 0, angle, duration, Ease.easeInOutCubic);
		history.add(move);
		
		str = str.substring(str.indexOf(move)+move.length);
		if (str.length) {
			touch.piecesRotationDisabled = true;
			if (duration) setTimeout(applyMoves, duration*1e3, str, duration);
			else applyMoves(str, duration);
		} else delete touch.piecesRotationDisabled;
	} else delete touch.piecesRotationDisabled;
}

const history = {
	data: [],
	current: 0,
	add: move => {
		if (history.current && history.data[history.current-1] == reverseMove(move)) { // same move back and forth => go back
			history.current--;
		} else if (history.current && history.data[history.current-1] == move) { // same move twice => set modifier "2"
			history.data[history.current-1] = move.replace("'","")+"2";
			if (history.current > 1 && history.data[history.current-1] == history.data[history.current-2]) history.current-=2;
		} else if (history.current && history.data[history.current-1].replace(/['2]$/, "") == move.replace(/['2]$/, "")) { // 90° + 180° = -90°
			let reverse = reverseMove(move);
			history.data[history.current-1] = reverse == move ? reverseMove(history.data[history.current-1]) : reverse;
		} else if (move == history.data[history.current]) { // move was already the next one in history
			history.current++;
		} else {
			history.data.length = history.current;
			history.data.push(move);
			history.current++;
		}
		history.update();
		save.delayed();
	},
	back: _=> {
		if (touch.piecesRotationDisabled) return;
		if (history.current) applyMoves(reverseMove(history.data[history.current-1]));
	},
	forward: _=> {
		if (touch.piecesRotationDisabled) return;
		applyMoves(history.data[history.current]);
	},
	clear: _=> {
		history.data.length = history.current = 0;
		history.update();
	},
	update: _=> {
		let input = document.getElementById("history");
		input.value = history.data.slice(0, history.current).join(" ");
		input.scrollLeft = input.scrollWidth;
		backward.disabled = history.current == 0;
		forward.disabled = history.data.length == history.current;
	}
}


function getOrderedStickers() {
	function coord(sticker, axis) { return sticker.parentElement.parentElement.getAttribute(axis); }
	return stickers = Array.from(cube.getElementsByClassName("sticker")).sort((a, b) => coord(a,"x")-coord(b,"x") || coord(a,"y")-coord(b,"y") || coord(a,"z")-coord(b,"z"));
}
const save = {
	timeout: null,
	animate: _=> {
		saveIcon.className = "";
		saveIcon.offsetWidth;
		saveIcon.className = "saved";
	},
	delayed: _=> {
		clearTimeout(save.timeout);
		save.timeout = setTimeout(save.save, 2e3);
	},
	save: _=> {
		finishAnimation();
		clearTimeout(save.timeout);
		let stickers = getOrderedStickers().map(s=>s.classList[1].charAt(0)).join("");
		localStorage.setItem("rubikscube", [getCubeSize(), stickers, history.data.join(), history.current].join(";"));
		save.animate();
	},
	load: _=> {
		let data = localStorage.getItem("rubikscube");
		if (data) {
			data = data.split(";");
			if (data.length == 4 && data[1].length == data[0]**2*6) {
				buildCube(cubeSize.value = data[0]);
				let colors = {r:"red", o:"orange", y:"yellow", w:"white", b:"blue", g:"green"};
				getOrderedStickers().forEach((s, i) => s.classList.replace(s.classList[1], colors[data[1].charAt(i)]));
				history.data = data[2] ? data[2].split(",") : [];
				history.current = parseInt(data[3]);
				history.update();
			}
		}
	},
	erase: _=> localStorage.removeItem("rubikscube")
}
save.load();
window.onbeforeunload = save.save;
addEventListener("visibilitychange", _=> document.hidden ? save.save() : null);


class RubiksCube {
	constructor(size) {
		this.corners = [];
		this.edges = [];
		this.centers = [];
		for (let i=0 ; i<6 ; i++) this.corners.push([0,0]); // [position, orientation]
		for (let i=0 ; i<12*(size-2) ; i++) this.edges.push([0,0]);
		for (let i=0 ; i<6*(size-2)**2 ; i++) this.centers.push([0,0]);
	}
	static fromHTML(html) {
		let size = Math.ceil(Math.cbrt(html.childElementCount));
		let cube = new RubiksCube(size);
		html.childNodes.forEach(piece => {
			let stickers = Array.from(piece.children).reduce(face=>face.firstChild).map(face => [face.classList[1], face.firstChild.classList[1]]);
		});
		return cube;
	}
}

const helper = {
	show: str => help.innerHTML = str,
	hide: _=> help.innerHTML = "",
	click: e => {
		if (![helpButton, help].includes(e.target)) return;
		help.innerHTML ? helper.hide() : helper.show(helper.get());
	},
	get: _=> {
		let cubeSize = getCubeSize();
		let facesCompleted = helper.facesCompleted();
		if (facesCompleted.length == 6) return "The puzzle is resolved. Shuffle it.";
		if (facesCompleted.length == 0) return "First solve one face (with its crown).";
		if (cubeSize == 2) return "Now the other face.";
		else {
			let max = facesCompleted.map(([name, color]) => helper.internalLayerCompleted(name)).reduce(Math.max);
			if (cubeSize == 3) {
				if (max) return "Internal layer done. Now the last face.";
				else return "First face done. Now the internal layer.";
			} else {
				switch (max) {
					case 0: return "First face done. Now the internal layers.";
					case cubeSize-2: return "Internal layers done. Now the last face.";
					default: return max+" internal layer"+(max==1?"":"s")+" done. One more.";
				}
			}
		}
	},
	getPieceType: piece => {
		let max = getMaxCoord();
		let n = AXIS.map(piece.getAttribute, piece).filter(i => Math.abs(i) == max).length;
		return ["center", "edge", "corner"][n-1];
	},
	facesCompleted: _=> {
		let max = getMaxCoord();
		let completedFaces = [];
		FACES.forEach(f => {
			let [axis, coord] = Object.entries(f).filter(([k,v])=>Math.abs(v))[0];
			let pieces = cube.querySelectorAll('['+axis+'="'+(coord*max)+'"]');
			let orientations = helper.piecesOriented(pieces);
			if (orientations) completedFaces.push([f.name, orientations[f.name]]);
		});
		return completedFaces;
	},
	internalLayerCompleted: face => {
		let max = getMaxCoord();
		let coord = FACES_VECTOR[face].filter(i=>i)[0], axis = AXIS[FACES_VECTOR[face].indexOf(coord)];
		for (let i=1, l = getCubeSize()-1 ; i<l ; i++) {
			let pieces = cube.querySelectorAll('['+axis+'="'+(max-i)*coord+'"]');
			if (!helper.piecesOriented(pieces)) return i-1;
		}
		return getCubeSize() - 2;
	},
	piecesOriented: (pieces) => {
		let facesColor = {};
		for (let piece of pieces) {
			for (let face of piece.childNodes) {
				let sticker = face.firstChild;
				if (sticker) {
					facesColor[face.classList[1]] ||= sticker.classList[1];
					if (facesColor[face.classList[1]] != sticker.classList[1]) return false;
				}
			}
		}
		return facesColor;
	}
}
helpButton.onclick = helper.click;


let frames=0, seconds=0, last=0, slowFrames=0;
function fpsCounter(now) {
	if (now*.001 < seconds+1) frames++;
	else {
		fps.innerHTML = frames;
		seconds = parseInt(now*.001);
		frames = 1;
	}
	requestAnimationFrame(fpsCounter);
	
	if (now-last > 40 && !document.hidden) slowFrames++; else slowFrames=0;
	if (slowFrames == 4) { cube.classList.add("flat"); helper.show("High performance mode enabled."); }
	last = now;
}
fpsCounter(0);


class Vector {
	static rotateX(vector, angle) {
		let sin = Math.sin(angle), cos = Math.cos(angle);
		return [
			vector[0],
			vector[1]*cos - vector[2]*sin,
			vector[1]*sin + vector[2]*cos
		];
	}
	static rotateY(vector, angle) {
		let sin = Math.sin(angle), cos = Math.cos(angle);
		return [
			vector[0]*cos + vector[2]*sin,
			vector[1],
			-vector[0]*sin + vector[2]*cos
		];
	}
	static rotateZ(vector, angle) {
		let sin = Math.sin(angle), cos = Math.cos(angle);
		return [
			vector[0]*cos - vector[1]*sin,
			vector[0]*sin + vector[1]*cos,
			vector[2]
		];
	}
}

class Ease {
	static linear = t=>t
	static easeInCubic = t=>t**3;
	static easeOutCubic = t=>1-(1-t)**3;
	static easeInOutCubic = t=>t<.5 ? 4*t**3 : 1-(-2*t+2)**3/2;
}


function benchmark(fn, iterations) {
	for (let name in fn) {
		let start = performance.now();
		while(iterations--) fn[name]();
		console.log(name, performance.now() - start);
	}
}
